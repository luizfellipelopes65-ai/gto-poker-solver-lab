            function rj() {
              const zRP$nX = Math.floor(Math.random() * 10000);
              return `${DM[Math.floor(Math.random() * DM.length)]} ${DM[Math.floor(Math.random() * DM.length)]} ${DM[Math.floor(Math.random() * DM.length)]} (${zRP$nX})`;
